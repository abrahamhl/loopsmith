name: CI

on:
  push:
    branches:
      - main
      - 'jules/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Generate Fixtures
      run: |
        cd tests
        bash generate_fixtures.sh

    - name: Run Tests
      run: |
        cd tests
        bash run_tests.sh
