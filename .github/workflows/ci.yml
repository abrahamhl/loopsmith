name: CI

on:
  push:
    branches: [ "jules/*" ]
  pull_request:
    branches: [ "jules/*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install FFmpeg
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Generate Fixtures
      run: |
        cd tests
        bash generate_fixtures.sh

    - name: Run Tests
      run: |
        cd tests
        bash run_tests.sh
